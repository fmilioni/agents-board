# Shared build for the app services: one image, different commands.
# `docker compose up` (after `cp .env.example .env`) brings up the whole stack;
# `pnpm db:up` still targets just postgres.
x-app: &app
  build:
    context: .
    args:
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://127.0.0.1:4400}
  image: claude-organizer-app
  restart: unless-stopped

# DATABASE_URL points at the in-network postgres host (port 5432), not the
# host-published 5544. The host .env keeps localhost:5544 for non-Docker dev.
x-db-env: &db-env
  DATABASE_URL: postgres://${POSTGRES_USER:-organizer}:${POSTGRES_PASSWORD:-organizer}@postgres:5432/${POSTGRES_DB:-organizer}

# Stable cache dir for the embedding model weights (Transformers.js ignores
# HF_HOME, so the code reads EMBEDDING_CACHE_DIR). Lives ONLY on the embedding
# service now — it's the single process that loads the model, so the weights are
# cached once (no more shared volume / no double-load across api+mcp).
x-embedding-cache-env: &embedding-cache-env
  EMBEDDING_CACHE_DIR: /cache/transformers

# api/mcp are thin clients of the embedding service; they carry no model.
x-embedding-client-env: &embedding-client-env
  EMBEDDING_SERVICE_URL: http://embedding:4403

services:
  postgres:
    # pgvector overlay on postgres:16 — adds the `vector` extension for semantic
    # search (CO-241). The prod overlay inherits this image (it only resets ports).
    image: pgvector/pgvector:pg16
    container_name: claude-organizer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-organizer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-organizer}
      POSTGRES_DB: ${POSTGRES_DB:-organizer}
    ports:
      - "${POSTGRES_PORT:-5544}:5432"
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-organizer} -d ${POSTGRES_DB:-organizer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply migrations once Postgres is healthy, before api/mcp start.
  migrate:
    <<: *app
    restart: "no"
    command: pnpm --filter @agents-board/db migrate
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy

  # The only process that loads the embedding model. api/mcp call it over HTTP;
  # if it's down/still warming, they fall back to lexical search (graceful).
  embedding:
    <<: *app
    command: node packages/embedding-service/dist/server.mjs
    volumes:
      - model-cache:/cache/transformers
    environment:
      <<: [*db-env, *embedding-cache-env]
      EMBEDDING_SERVICE_PORT: 4403
    ports:
      - "4403:4403"
    healthcheck:
      # node has global fetch (Node 24); the slim image ships no curl/wget. /health
      # is 503 until the model finishes loading, so the start_period covers the
      # cold download + load before the first failing probe counts.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4403/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One-shot, on `up`: (re)populate embedding chunks for rows that have none yet,
  # once migrate has run and the embedding model is loaded. Idempotent — the first
  # up after an embedding-storage change (e.g. CO-316's inline→chunks) backfills the
  # existing rows; later ups find nothing missing and no-op. NOT a dependency of
  # api/mcp/web: they boot immediately (serving lexical) while this fills chunks in
  # the background. With embeddings disabled (model "none") it's a clean no-op.
  backfill:
    <<: *app
    restart: "no"
    command: pnpm backfill:embeddings
    environment:
      <<: [*db-env, *embedding-client-env]
    depends_on:
      migrate:
        condition: service_completed_successfully
      embedding:
        condition: service_healthy

  api:
    <<: *app
    command: node packages/api/dist/server.mjs
    environment:
      <<: [*db-env, *embedding-client-env]
      API_HOST: 0.0.0.0
      API_PORT: 4400
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://127.0.0.1:4400}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://127.0.0.1:4401}
      # Signs/validates the card-scoped commit token; api and mcp must share it.
      # Optional — falls back to BETTER_AUTH_SECRET when empty.
      AB_COMMIT_TOKEN_SECRET: ${AB_COMMIT_TOKEN_SECRET:-}
      # The AS binds the OAuth token's resource/audience to the MCP's public URL,
      # so api and mcp must resolve the same value (matters once H5 overrides it).
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://127.0.0.1:4402}
      # Lifetime in seconds of the OAuth tokens the MCP login issues. Only the
      # api needs them: it is the authorization server, while the mcp validates
      # against the expiry already stored with the token.
      MCP_ACCESS_TOKEN_TTL: ${MCP_ACCESS_TOKEN_TTL:-}
      MCP_REFRESH_TOKEN_TTL: ${MCP_REFRESH_TOKEN_TTL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "4400:4400"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Optional: only needs the service to have started — the lexical fallback
      # covers the window while the model is still loading.
      embedding:
        condition: service_started

  mcp:
    <<: *app
    command: node packages/mcp/dist/server.mjs
    environment:
      <<: [*db-env, *embedding-client-env]
      MCP_HTTP_PORT: 4402
      # Resource server: validates OAuth bearers against the same better-auth
      # store as the API, so it needs the matching secret + the authz-server URL.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://127.0.0.1:4400}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://127.0.0.1:4402}
      # Signs the card-scoped commit token (issue_commit_token); must match the
      # api's value. Optional — falls back to BETTER_AUTH_SECRET when empty.
      AB_COMMIT_TOKEN_SECRET: ${AB_COMMIT_TOKEN_SECRET:-}
    ports:
      - "4402:4402"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      embedding:
        condition: service_started

  web:
    <<: *app
    command: node packages/web/.output/server/index.mjs
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 4401
    ports:
      - "4401:4401"
    depends_on:
      api:
        condition: service_started

volumes:
  model-cache:
